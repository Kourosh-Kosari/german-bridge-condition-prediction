<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan A — Future Condition</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
#panel{position:absolute;z-index:1000;top:10px;left:45px;background:#fff;padding:10px 12px;border-radius:6px;box-shadow:0 1px 6px #777;font:14px Arial;max-width:310px}
#panel select,#panel input{margin:3px 0}
#status{font-size:12px;margin-top:5px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
<b>Plan A — Future Condition</b><br>
<label>Horizon:
<select id="horizon">
<option value="0">Current</option><option value="10">10 years</option>
<option value="20">20 years</option><option value="30">30 years</option>
<option value="40">40 years</option><option value="50" selected>50 years</option>
</select></label><br>
<label>Custom years:
<input id="custom" type="number" min="0" step="1" placeholder="e.g. 17" style="width:80px"></label>
<div id="status">Loading...</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>
<script>
const DATA_FILE = "../plan_a_web_map_data.csv";

const map = L.map("map", {preferCanvas:true}).setView([51.16,10.45],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);

function webMercatorToLatLng(x,y){
  const R=6378137;
  const lon=x/R*180/Math.PI;
  const lat=(2*Math.atan(Math.exp(y/R))-Math.PI/2)*180/Math.PI;
  return [lat,lon];
}

function n(v){
  const x=parseFloat(v);
  return Number.isFinite(x)?x:null;
}

let rows=[];
let layer=L.layerGroup().addTo(map);

function futureValue(r,h){
  const current=n(r.predicted_zustandsnote_t0);
  if(current===null) return null;
  if(h===0) return current;

  const direct=r["zustandsnote_tplus_"+h+"y"];
  if(direct!==undefined && n(direct)!==null) return n(direct);

  const r10=n(r.zustandsnote_tplus_10y);
  const r20=n(r.zustandsnote_tplus_20y);
  if(r10===null || r20===null) return null;

  const rate=(r20-r10)/10;
  return Math.min(4,Math.max(1,current+rate*h));
}

function render(){
  layer.clearLayers();
  let h=parseFloat(document.getElementById("custom").value);
  if(!Number.isFinite(h) || h<0) h=parseFloat(document.getElementById("horizon").value);
  let count=0;

  for(const r of rows){
    const x=n(r.geom_x), y=n(r.geom_y);
    if(x===null||y===null) continue;
    const [lat,lon]=webMercatorToLatLng(x,y);
    if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180) continue;

    const current=n(r.predicted_zustandsnote_t0);
    const future=futureValue(r,h);

    const html =
      "<b>Bridge ID:</b> "+(r.bridge_id||"")+
      "<br><b>Bauwerksart:</b> "+(r.bauwerksart_text||"")+
      "<br><b>Baujahr:</b> "+(r.baujahr||"")+
      "<br><b>Länge:</b> "+(r.laenge||"")+" m"+
      "<br><b>Breite:</b> "+(r.breite||"")+" m"+
      "<br><b>Current ML condition:</b> "+(current===null?"n/a":current.toFixed(2))+
      "<br><b>Horizon:</b> "+h+" years"+
      "<br><b>Future condition:</b> "+(future===null?"n/a":future.toFixed(2))+
      "<br><small>Mode: "+(r.forecast_mode||"n/a")+
      "<br>Status: "+(r.forecast_status||"n/a")+"</small>";

    L.circleMarker([lat,lon],{
      radius:3,weight:0.5,fillOpacity:0.65
    }).bindPopup(html).addTo(layer);
    count++;
  }
  document.getElementById("status").textContent=count.toLocaleString()+" bridges displayed";
}

Papa.parse(DATA_FILE,{
  download:true,header:true,dynamicTyping:false,
  complete:function(res){
    rows=res.data.filter(r=>r.bridge_id);
    render();
    if(rows.length){
      const pts=rows.map(r=>{
        const x=n(r.geom_x),y=n(r.geom_y);
        return (x===null||y===null)?null:webMercatorToLatLng(x,y);
      }).filter(Boolean);
      if(pts.length) map.fitBounds(pts,{padding:[20,20]});
    }
  },
  error:function(err){
    document.getElementById("status").textContent="CSV load error: "+err;
  }
});

document.getElementById("horizon").addEventListener("change",()=>{
  document.getElementById("custom").value="";
  render();
});
document.getElementById("custom").addEventListener("input",render);
</script>
</body>
</html>
